name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit suite
        run: node --test tests/*.test.mjs
      - name: pyyaml for the action check
        run: python3 -m pip install --quiet pyyaml
      - name: action definition matches the code
        run: python3 scripts/check_action.py

  # Runs the Action against a lockfile built here, so a change that breaks the composite step is
  # caught by this repository rather than by whoever installs it next. The fixture deliberately
  # adds a package with a postinstall script, so a passing gate here would mean the Action is not
  # working, and the step asserts a non-zero exit rather than a zero one.
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build a fixture with a violation in it
        run: |
          mkdir -p fixture
          cat > fixture/package-lock.json <<'JSON'
          {
            "name": "fixture",
            "lockfileVersion": 3,
            "packages": {
              "": { "name": "fixture", "version": "1.0.0" },
              "node_modules/left-pad": { "version": "1.3.0", "license": "MIT" },
              "node_modules/esbuild": {
                "version": "0.25.0", "license": "MIT", "hasInstallScript": true
              }
            }
          }
          JSON
          cat > fixture/base.json <<'JSON'
          {
            "name": "fixture",
            "lockfileVersion": 3,
            "packages": {
              "": { "name": "fixture", "version": "1.0.0" },
              "node_modules/left-pad": { "version": "1.3.0", "license": "MIT" }
            }
          }
          JSON
      # Path 1: fail: "false". The Action succeeds, so GitHub collects its outputs, and the
      # caller decides from exit-code. This is the only way to read the counts on a run that
      # found something, because a failing composite action has its outputs discarded.
      - name: outputs are populated when the Action is told not to fail
        id: soft
        uses: ./
        with:
          working-directory: fixture
          base-ref: base.json
          min-age-days: "0"
          fail: "false"
      - name: assert the counts
        env:
          CODE: ${{ steps.soft.outputs.exit-code }}
          BLOCKING: ${{ steps.soft.outputs.blocking }}
          ADDED: ${{ steps.soft.outputs.added }}
          FINDINGS: ${{ steps.soft.outputs.findings }}
        run: |
          for pair in "CODE:1" "BLOCKING:1" "ADDED:1" "FINDINGS:1"; do
            name="${pair%%:*}"; want="${pair##*:}"
            eval "got=\$$name"
            if [ "$got" != "$want" ]; then
              echo "expected $name=$want, got '$got'"
              exit 1
            fi
          done
          echo "exit-code=1 blocking=1 added=1 findings=1, all present on a failing gate"

      # Path 2: the default. The Action itself fails the job, which is the point of a gate.
      - name: the gate must fail the job on a violation
        id: hard
        continue-on-error: true
        uses: ./
        with:
          working-directory: fixture
          base-ref: base.json
          min-age-days: "0"
      - name: assert it failed
        env:
          OUTCOME: ${{ steps.hard.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "the Action passed a lockfile that adds a package with a postinstall script"
            exit 1
          fi
          echo "the Action failed the job, as a gate must"

      # Path 3: the negative control. Without it a broken Action that always fails would pass
      # both steps above and look correct.
      - name: the gate must pass when the change adds nothing
        id: clean
        uses: ./
        with:
          working-directory: fixture
          base-ref: package-lock.json
          min-age-days: "0"
      - name: assert the clean run reports nothing
        env:
          BLOCKING: ${{ steps.clean.outputs.blocking }}
          ADDED: ${{ steps.clean.outputs.added }}
        run: |
          if [ "$BLOCKING" != "0" ] || [ "$ADDED" != "0" ]; then
            echo "expected blocking=0 added=0 on an unchanged lockfile, got '$BLOCKING' '$ADDED'"
            exit 1
          fi
          echo "unchanged lockfile: blocking=0 added=0"
